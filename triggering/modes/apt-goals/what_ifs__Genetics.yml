EN:
  statement1: "suppose a child has a trait such as dimples that is different from what both parents have. Is that possible? If so, how? Discuss with your partner what you think is correct."
  
  statement2: "suppose we only know the phenotype of a person, such as brown eye color, but we do not know their genotype. How certain can we be of their genotype? Explain what you think to your partner."
  
  statement3: "suppose the present alleles in the person are Aa, where the capital letter (A) stands for brown eyes, and the lowercase letter (a) stands for blue eyes. What eye color will the person have? Explain what you think to your partner."
  
  statement4: "suppose there are three possible genotype combinations: BB, Bb, and bb. How do the different combinations affect the characteristics of the person? Discuss with your partner what you think is correct."
  
  statement5: "suppose two sisters have different genotypes; one has genotype Bb and the other bb. Do you think they will show the same physical trait? Why/why not?"
  
  statement6: "suppose a normal cell has genotype Aa, what would the genotype of a single gamete (sperm OR egg) be? Discuss with your partner why this is so."
  
  statement7: "suppose a trait has three possible genotypes: AA, Aa, and aa. Which of these is homozygous and which is heterozygous? Discuss with your partner why this is so."

NL:
  statement1: "stel een kind heeft een eigenschap zoals kuiltjes wat anders is dan wat beide ouders hebben. Is dat mogelijk? Zo ja, hoe dan? Overleg met je partner wat jullie denken dat juist is"
  
  statement2: "stel we weten alleen het fenotype van een persoon, zoals een bruine oogkleur, maar we weten niet hun genotype. Hoe zeker kunnen we zijn van hun genotype. Leg uit wat je denkt aan je partner"
  
  statement3: "stel de aanwezige allelen in de persoon zijn Aa, waarin  de hoofdletter (A) staat voor bruine ogen, en de kleine letter (a) voor blauwe ogen. Welke oogkleur zal de persoon dan hebben? Leg uit wat je denkt aan je partner"
  
  statement4: "stel er zijn drie mogelijke genotype combinaties: BB, Bb en bb. Hoe hebben de verschillende combinaties effect op de eigenschappen van de persoon? Overleg met je partner wat jullie denken dat juist is."
  
  statement5: "stel twee zussen hebben verschillende genotypes; de een heeft genotype Bb en de ander bb. Denken jullie dat ze dezelfde fysieke eigenschap zullen vertonen? Waarom wel/niet?"
  
  statement6: "stel een normale cell heeft genotype Aa, wat zou dan het genotype van een enkele gameet (sperma OF eicel) zijn?"
  
  statement7: "stel een eigenschap heeft drie mogelijke genotypes: AA, Aa en aa. Welk van deze is homozygoot en welke is heterozygoot? Overleg samen met je partner waarom dit zo is."

PT:
  statement1: "suponha que uma criança tenha uma característica como covinhas, diferente do que ambos os pais têm. Isso é possível? Se sim, como? Discuta com seu parceiro o que vocês acham que é correto."
  
  statement2: "suponha que sabemos apenas o fenótipo de uma pessoa, como cor de olhos castanhos, mas não sabemos o genótipo. Quão certos podemos estar sobre o genótipo dela? Explique o que você pensa ao seu parceiro."
  
  statement3: "suponha que os alelos presentes na pessoa são Aa, onde a letra maiúscula (A) representa olhos castanhos, e a letra minúscula (a) representa olhos azuis. Qual cor de olhos a pessoa terá? Explique o que você pensa ao seu parceiro."
  
  statement4: "suponha que há três combinações de genótipos possíveis: BB, Bb e bb. Como as diferentes combinações afetam as características da pessoa? Discuta com seu parceiro o que vocês acham que é correto"
  
  statement5: "suponha que duas irmãs têm genótipos diferentes; uma tem genótipo Bb e a outra bb. Vocês acham que elas terão a mesma característica física? Por quê/sim ou não?"
  
  statement6: "suponha que uma célula normal tenha genótipo Aa, qual seria o genótipo de um único gameta (esperma OU óvulo)? Discuta com seu parceiro por que é assim."
  
  statement7: "suponha que uma característica tenha três genótipos possíveis: AA, Aa e aa. Qual destes é homozigoto e qual é heterozigoto? Discuta com seu parceiro por que é assim."

ES:
  statement1: "suponga que un niño tiene una característica como covinhas que es diferente de lo que ambos padres tienen. ¿Es posible? Si es así, ¿cómo? Discute con tu compañero lo que tú piensas que es correcto."
  
  statement2: "suponga que solo conocemos el fenotipo de una persona, como el color de ojos marrones, pero no conocemos su genotipo. ¿Qué tan seguros podemos estar de su genotipo? Explique lo que piensa a su pareja."
  
  statement3: "suponga que los alelos presentes en la persona son Aa, donde la letra mayúscula (A) representa ojos marrones, y la letra minúscula (a) representa ojos azules. ¿Qué color de ojos tendrá la persona? Explique lo que piensa a su pareja."
  
  statement4: "suponga que hay tres combinaciones posibles de genotipos: BB, Bb y bb. ¿Cómo afectan las diferentes combinaciones a las características de la persona? Discuta con su pareja lo que creen que es correcto."
  
  statement5: "suponga que dos hermanas tienen diferentes genotipos; una tiene el genotipo Bb y la otra bb. ¿Creen que mostrarán la misma característica física? ¿Por qué sí/no?"
  
  statement6: "suponga que una célula normal tiene el genotipo Aa, ¿cuál sería el genotipo de un solo gameto (esperma O óvulo)? Discuta con su pareja por qué es así."
  
  statement7: "suponga que una característica tiene tres genotipos posibles: AA, Aa y aa. ¿Cuál de estos es homocigoto y cuál es heterocigoto? Discuta con su pareja por qué es así."
